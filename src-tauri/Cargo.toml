[package]
name = "win11-volume-mixer"
version = "0.2.0"
description = "Windows 11 轻量级应用音量控制器"
authors = ["Floooint"]
repository = "https://github.com/Floooint/win11-volume-mixer"
license = "MIT"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
# 库名必须与可执行文件名不同，否则 Windows 上会冲突，
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "volume_mixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
thiserror = "2.0.21"
windows-core = "0.62"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "UI_ViewManagement", "UI", "Foundation"] }
png = "0.18"
percent-encoding = "2"
tokio = { version = "1.53.1", default-features = false, features = ["sync", "time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# 体积优化，见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
