[package]
name = "win11-volume-mixer"
version = "0.1.0"
description = "Windows 11 轻量级应用音量控制器"
authors = ["Floooint"]
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
# 库名必须与可执行文件名不同，否则 Windows 上会冲突，
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "volume_mixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 体积优化，见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
